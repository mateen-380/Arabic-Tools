<section class="section">
  <div class="tool" style="max-width:700px;margin:auto;">
    <h2>ضغط الصور</h2>
    <p>قلل حجم الصورة بسهولة مع الحفاظ على جودة جيدة.</p>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      style="margin:15px 0;"
    >

    <label for="quality">جودة الصورة:</label>

    <select id="quality" style="padding:10px;margin:10px;">
      <option value="0.9">عالية</option>
      <option value="0.7" selected>متوسطة</option>
      <option value="0.5">منخفضة</option>
    </select>

    <br>

    <button
      onclick="compressImage()"
      style="padding:12px 25px;background:#18245f;color:white;border:0;border-radius:9px;cursor:pointer;"
    >
      ضغط الصورة
    </button>

    <p id="result" style="margin-top:15px;"></p>

    <a
      id="download"
      style="display:none;background:#ffbd00;color:#111;padding:12px 20px;border-radius:9px;text-decoration:none;font-weight:bold;"
      download="compressed-image.jpg"
    >
      تحميل الصورة المضغوطة
    </a>
  </div>
</section>

<script>
function compressImage() {
  const input = document.getElementById("imageInput");
  const quality = parseFloat(document.getElementById("quality").value);
  const result = document.getElementById("result");
  const download = document.getElementById("download");

  if (!input.files.length) {
    result.textContent = "يرجى اختيار صورة أولاً.";
    return;
  }

  const file = input.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    const img = new Image();

    img.onload = function() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const maxWidth = 1600;
      const scale = Math.min(1, maxWidth / img.width);

      canvas.width = img.width * scale;
      canvas.height = img.height * scale;

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);

        download.href = url;
        download.style.display = "inline-block";

        const originalKB = Math.round(file.size / 1024);
        const compressedKB = Math.round(blob.size / 1024);

        result.textContent =
          "تم ضغط الصورة بنجاح. الحجم الأصلي: " +
          originalKB +
          " KB — الحجم الجديد: " +
          compressedKB +
          " KB";
      }, "image/jpeg", quality);
    };

    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
}
</script>
